[Module]
Enabled=1
Debug=0

[Settings]
; 1 = No NEW wanted level while at a police station when wearing the cop outfit.
;     CLEO Redux-safe rewrite of the original INTMAN/IMPND behavior.
; 2 = Police ignore you while the cop outfit is active. Wanted stars may still exist.
; 3 = No wanted level while the cop outfit is active. (Original default)
Mode=3

; 0 = Require cop/emergency outfit/skin. The POLICETR torso alone counts; hat is NOT required.
; 1 = Apply the selected mode all the time.
AlwaysEnabled=0
